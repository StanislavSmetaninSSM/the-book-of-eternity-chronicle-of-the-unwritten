

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Book of Eternity: Chronicle of the Unwritten</title>
    <link rel="stylesheet" href="/index.css">
    
</head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <div id="boot-status" role="status" style="display:none;position:fixed;z-index:99999;inset:1rem auto auto 1rem;max-width:min(42rem,calc(100vw - 2rem));padding:1rem 1.25rem;border:1px solid #f87171;border-radius:.75rem;background:#111827;color:#fee2e2;font:14px/1.5 system-ui,sans-serif;white-space:pre-wrap;box-shadow:0 10px 30px #0008"></div>
    <script>
      (() => {
        const root = document.getElementById('root');
        const panel = document.getElementById('boot-status');
        let firstError = '';
        const showError = (message) => {
          firstError = firstError || message;
          panel.textContent = `Не удалось загрузить приложение / The app failed to load.\n${firstError}\nОбновите страницу; если ошибка повторится, пришлите этот текст.\nReload the page; if the error repeats, send us this text.`;
          panel.style.display = 'block';
        };
        window.addEventListener('error', (event) => showError(event.message || 'Ошибка загрузки JavaScript / JavaScript failed to load.'));
        window.addEventListener('unhandledrejection', (event) => showError(event.reason?.message || String(event.reason || 'Ошибка запуска приложения / The app failed to start.')));
        new MutationObserver(() => { if (root?.children.length) panel.style.display = 'none'; }).observe(root, { childList: true });
        setTimeout(() => { if (!root?.children.length) showError(firstError || 'Интерфейс не смонтировался за 8 секунд / The interface did not mount within 8 seconds.'); }, 8000);
      })();
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
