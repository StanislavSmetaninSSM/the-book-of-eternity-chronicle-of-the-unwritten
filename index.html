

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Book of Eternity: Chronicle of the Unwritten</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
    
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.0.0-rc.0/",
    "react": "https://esm.sh/react@^19.0.0-rc.0",
    "react-dom/": "https://esm.sh/react-dom@^19.0.0-rc.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.10.0",
    "@heroicons/react/": "https://esm.sh/@heroicons/react@^2.1.5/",
    "react-dom": "https://esm.sh/react-dom@^19.0.0-rc.0",
    "dompurify": "https://esm.sh/dompurify@3.1.6",
    "marked": "https://esm.sh/marked@^16.1.1",
    "components/": "https://aistudiocdn.com/components@^0.1.0/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <div id="boot-status" role="status" style="display:none;position:fixed;z-index:99999;inset:1rem auto auto 1rem;max-width:min(42rem,calc(100vw - 2rem));padding:1rem 1.25rem;border:1px solid #f87171;border-radius:.75rem;background:#111827;color:#fee2e2;font:14px/1.5 system-ui,sans-serif;white-space:pre-wrap;box-shadow:0 10px 30px #0008"></div>
    <script>
      (() => {
        const root = document.getElementById('root');
        const panel = document.getElementById('boot-status');
        let firstError = '';
        const showError = (message) => {
          firstError = firstError || message;
          panel.textContent = `Не удалось загрузить приложение.\n${firstError}\nОбновите страницу; если ошибка повторится, пришлите этот текст.`;
          panel.style.display = 'block';
        };
        window.addEventListener('error', (event) => showError(event.message || 'Ошибка загрузки JavaScript.'));
        window.addEventListener('unhandledrejection', (event) => showError(event.reason?.message || String(event.reason || 'Ошибка запуска приложения.')));
        new MutationObserver(() => { if (root?.children.length) panel.style.display = 'none'; }).observe(root, { childList: true });
        setTimeout(() => { if (!root?.children.length) showError(firstError || 'Интерфейс не смонтировался за 8 секунд.'); }, 8000);
      })();
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
