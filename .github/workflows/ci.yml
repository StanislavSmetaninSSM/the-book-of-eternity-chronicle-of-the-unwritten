name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/unit-tests.log
      # The raw log lives behind a signed Azure URL, so surface the failing cases as
      # annotations: they are readable from the pull request without downloading it.
      - name: Report failing tests
        if: failure()
        run: |
          if [ -f /tmp/unit-tests.log ]; then
            grep -A 30 -E "^not ok" /tmp/unit-tests.log | head -80 | sed 's/^/::error::/' || true
          fi
      - name: Production build
        run: npm run build

  e2e:
    name: Playwright browser smoke
    # Confirmed green on CI hardware: a real Chromium against the production build.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Browser smoke tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
